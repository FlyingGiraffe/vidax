<!-- Dark-mode wordmark: transparent-background icon (same mark as
     logo-light.svg, no dark box -- a boxed icon would look like a stray
     card against the page's own dark background) plus "vidax" set in a
     light ink so it reads on a dark background. Paired with
     wordmark-light.svg (srcDark <-> src in README's <picture> element,
     same convention as logo.svg/logo-light.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 100" height="100">
  <path d="M 22 28 L 40 72 L 52 72 L 34 28 Z" fill="#38BDF8" />
  <path d="M 48 72 L 62 28 L 70 28 L 56 72 Z" fill="#38BDF8" />
  <path d="M 64 72 L 78 28 L 86 28 L 72 72 Z" fill="#0284C7" />
  <!-- textLength/lengthAdjust pins the rendered width regardless of which
       fallback font a viewer actually has installed, so the 22px margin on
       each side of the icon+wordmark stays symmetric (the viewBox width
       below is sized exactly to this fixed text width -- if you ever
       change the text or font stack, this width needs recomputing too). -->
  <text x="108" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#F1F5F9"
        textLength="165" lengthAdjust="spacingAndGlyphs">vidax</text>
</svg>
