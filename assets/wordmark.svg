<!-- Single wordmark, used as-is in both light and dark viewers (no
     <picture>/prefers-color-scheme split - many Markdown renderers don't
     honor that switch, and prefers-color-scheme follows the OS setting
     anyway, not whatever theme the viewer is actually rendered in). "vidax"
     is dark slate ink with a pure-white stroke (paint-order="stroke" puts
     the stroke under the fill): on a white page the stroke matches the
     background exactly and disappears, leaving plain dark text; on a dark
     background the same stroke becomes a visible halo that keeps the
     letters legible even though the fill itself is dark. One file, correct
     on both. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 100" height="100">
  <path d="M 22 28 L 40 72 L 52 72 L 34 28 Z" fill="#38BDF8" />
  <path d="M 48 72 L 62 28 L 70 28 L 56 72 Z" fill="#38BDF8" />
  <path d="M 64 72 L 78 28 L 86 28 L 72 72 Z" fill="#0284C7" />
  <!-- textLength/lengthAdjust pins the rendered width regardless of which
       fallback font a viewer actually has installed, so the 22px margin on
       each side of the icon+wordmark stays symmetric (the viewBox width
       below is sized exactly to this fixed text width; if you ever change
       the text or font stack, this width needs recomputing too).
       "spacingAndGlyphs" applies a horizontal-only scale to hit that width,
       which would otherwise distort the stroke halo below into an uneven
       (squashed/stretched) ring; vector-effect="non-scaling-stroke" keeps
       the stroke itself a constant width regardless of that scale. -->
  <text x="108" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#0F172A"
        stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"
        stroke-linecap="round" paint-order="stroke"
        vector-effect="non-scaling-stroke"
        textLength="165" lengthAdjust="spacingAndGlyphs">vidax</text>
</svg>
