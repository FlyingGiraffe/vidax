name: Publish to PyPI

# Builds the package and publishes it to PyPI via Trusted Publishing (OIDC --
# no API token stored in the repo).
#
# For now this only runs when started by hand from the Actions tab
# ("Run workflow"). Once a PyPI Trusted Publisher and the `pypi` GitHub
# environment are configured (see docs/releasing.md), uncomment the tag
# trigger below so it also fires automatically on every `v*` tag push.

on:
  # push:
  #   tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
