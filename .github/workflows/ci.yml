name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch, no CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Byte-compile everything
        run: python -m compileall -q src examples benchmarks

      - name: Import smoke test
        run: |
          python -c "
          import vidax
          print('vidax', vidax.__version__)
          from vidax import (
              load_torch_checkpoint_to_jax,
              RectifiedFlowScheduler,
              FlowUniPCMultistepScheduler,
              build_tpu_mesh,
              dot_product_attention,
          )
          import vidax.core, vidax.schedulers, vidax.translator
          print('imports OK')
          "

      - name: Build & check package
        run: |
          python -m build
          python -m twine check dist/*
