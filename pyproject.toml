[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidax"
dynamic = ["version"]
description = "Lightweight, hardware-agnostic JAX/Flax inference engine and PyTorch translator for Video DiTs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "FlyingGiraffe" }
]
keywords = [
    "jax", "flax", "tpu", "video-generation", "diffusion-transformer",
    "text-to-video", "image-to-video", "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies required by anyone using `vidax`. `torch`,
# `transformers`, and `sentencepiece` are core (not behind an extra) because
# every model needs them to *deserialize* the released `.pth`/`.pt`
# checkpoints and to tokenize text -- vidax's own model code (everything under
# `vidax.models`) never imports them. `pillow` loads the conditioning image
# for I2V.
dependencies = [
    "jax>=0.4.30",
    "flax>=0.8.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.9",
    "torch>=2.0.0",
    "transformers>=4.49.0",
    "sentencepiece>=0.1.99",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# Required on TPU VMs to get the correct TPU jaxlib wheel.
tpu = [
    "jax[tpu]>=0.4.30",
]

# Required to develop / test / build the package.
dev = [
    "pytest>=7.0.0",
    "pytest-xdist",    # parallel test execution
    "ruff>=0.6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/FlyingGiraffe/vidax"
Repository = "https://github.com/FlyingGiraffe/vidax"
Documentation = "https://github.com/FlyingGiraffe/vidax/blob/main/docs/index.md"
Issues = "https://github.com/FlyingGiraffe/vidax/issues"
Changelog = "https://github.com/FlyingGiraffe/vidax/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/vidax/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vidax"]

[tool.hatch.build.targets.sdist]
include = ["src/vidax", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["refs"]

[tool.ruff.lint]
# Scoped to pyflakes ("F") -- unused imports/names, undefined names, dead
# locals: the checks that catch genuinely broken code. Whole-codebase style
# enforcement (E501 line length, I import sorting) is deliberately not gated
# on -- the code has its own long-standing wrapping convention; a dedicated
# `ruff format` pass, reviewed on its own, is the way to change that.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# The example scripts end each stage with `del a, b, c, ...` to free large
# host-side checkpoint arrays. That makes those names function-locals of
# `main()` for the whole scope, which ruff's F821 flow analysis then can't
# resolve where they're read inside nested closures (`def encode`,
# `def sampling_step`) defined earlier in `main()`. The code is correct
# (every benchmark run exercises these paths); the finding is a known ruff
# limitation around `del` + closures.
"examples/*" = ["F821"]
